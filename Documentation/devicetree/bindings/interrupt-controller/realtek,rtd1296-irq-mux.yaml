%YAML 1.2
---
$id: http://devicetree.org/schemas/interrupt-controller/realtek,rtd1296-irq-mux.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek RTD1296 MISC and ISO interrupt muxes

maintainers:
  - Nguyen Quang Minh <oss@minhng99.eu>

description:
  The low-speed peripherals of the RTD1296 MISC and ISO blocks share a status
  and enable register per block.
  The ISO block can route its RTC alarm through a dedicated parent interrupt.
  The single interrupt specifier cell is the source bit in the status register.

properties:
  compatible:
    enum:
      - realtek,rtd1296-misc-irq-mux
      - realtek,rtd1296-iso-irq-mux

  reg:
    items:
      - description: Interrupt status register
      - description: Interrupt enable register

  interrupts:
    minItems: 1
    items:
      - description: Peripheral aggregate interrupt
      - description: Dedicated RTC alarm interrupt

  interrupt-names:
    minItems: 1
    items:
      - const: peripherals
      - const: rtc-alarm

  interrupt-controller: true

  '#interrupt-cells':
    const: 1

required:
  - compatible
  - reg
  - interrupts
  - interrupt-controller
  - '#interrupt-cells'

additionalProperties: false

allOf:
  - if:
      properties:
        compatible:
          const: realtek,rtd1296-misc-irq-mux
    then:
      properties:
        interrupts:
          maxItems: 1
        interrupt-names:
          maxItems: 1

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    interrupt-controller@0 {
        compatible = "realtek,rtd1296-iso-irq-mux";
        reg = <0x0 0x4>, <0x40 0x4>;
        interrupts = <GIC_SPI 41 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-controller;
        #interrupt-cells = <1>;
    };
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    interrupt-controller@0 {
        compatible = "realtek,rtd1296-iso-irq-mux";
        reg = <0x0 0x4>, <0x40 0x4>;
        interrupts = <GIC_SPI 41 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 39 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-names = "peripherals", "rtc-alarm";
        interrupt-controller;
        #interrupt-cells = <1>;
    };
