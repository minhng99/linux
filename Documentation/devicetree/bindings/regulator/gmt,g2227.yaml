%YAML 1.2
---
$id: http://devicetree.org/schemas/regulator/gmt,g2227.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: GMT G2227 power-management controller

maintainers:
  - Nguyen Quang Minh <oss@minhng99.eu>

description:
  The G2227 provides six buck converters and two LDO regulators, with
  software power-off control through its I2C interface.

properties:
  compatible:
    const: gmt,g2227

  reg:
    maxItems: 1

  system-power-controller: true

  regulators:
    type: object
    additionalProperties: false
    patternProperties:
      '^(dcdc[1-6]|ldo[23])$':
        type: object
        $ref: regulator.yaml#
        unevaluatedProperties: false

required:
  - compatible
  - reg
  - regulators

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        pmic@12 {
            compatible = "gmt,g2227";
            reg = <0x12>;
            system-power-controller;

            regulators {
                dcdc2 {
                    regulator-name = "vdd-cpu";
                    regulator-min-microvolt = <800000>;
                    regulator-max-microvolt = <1187500>;
                    regulator-always-on;
                };
            };
        };
    };
