%YAML 1.2
---
$id: http://devicetree.org/schemas/nvmem/realtek,rtd1296-efuse.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek RTD1296 eFuse readout

maintainers:
  - Nguyen Quang Minh <oss@minhng99.eu>

description:
  The readout aperture exposes 1024 bytes of eFuse data. Programming is
  separate from this aperture.

allOf:
  - $ref: nvmem.yaml#

properties:
  compatible:
    const: realtek,rtd1296-efuse

  reg:
    maxItems: 1

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    efuse@98017000 {
        compatible = "realtek,rtd1296-efuse";
        reg = <0x98017000 0x400>;
    };
