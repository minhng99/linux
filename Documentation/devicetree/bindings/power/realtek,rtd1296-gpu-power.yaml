%YAML 1.2
---
$id: http://devicetree.org/schemas/power/realtek,rtd1296-gpu-power.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek RTD1296 GPU power controller

maintainers:
  - Nguyen Quang Minh <oss@minhng99.eu>

description: |
  The controller manages GPU SRAM power and memory repair.
  It also sequences the GPU clock and reset around power transitions.

properties:
  compatible:
    const: realtek,rtd1296-gpu-power

  reg:
    maxItems: 1
    description: GPU memory-repair registers

  realtek,crt:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: CRT system controller containing the SRAM power registers

  clocks:
    maxItems: 1

  resets:
    maxItems: 1

  "#power-domain-cells":
    const: 0

required:
  - compatible
  - reg
  - realtek,crt
  - clocks
  - resets
  - "#power-domain-cells"

additionalProperties: false
