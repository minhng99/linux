%YAML 1.2
---
$id: http://devicetree.org/schemas/power/realtek,rtd1296-nat-sram-power.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek RTD1296 Ethernet switch SRAM power controller

maintainers:
  - Nguyen Quang Minh <oss@minhng99.eu>

description: |
  The controller manages SRAM power and isolation for the Ethernet switch.
  It is a child of the CRT system controller.

properties:
  compatible:
    const: realtek,rtd1296-nat-sram-power

  "#power-domain-cells":
    const: 0

required:
  - compatible
  - "#power-domain-cells"

additionalProperties: false
