%YAML 1.2
---
$id: http://devicetree.org/schemas/thermal/realtek,rtd1296-thermal.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek RTD1296 thermal sensor

maintainers:
  - Nguyen Quang Minh <oss@minhng99.eu>

allOf:
  - $ref: thermal-sensor.yaml#

properties:
  compatible:
    const: realtek,rtd1296-thermal

  reg:
    maxItems: 1

  '#thermal-sensor-cells':
    const: 0

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    thermal-sensor@9801d150 {
        compatible = "realtek,rtd1296-thermal";
        reg = <0x9801d150 0x20>;
        #thermal-sensor-cells = <0>;
    };
