%YAML 1.2
---
$id: http://devicetree.org/schemas/rtc/realtek,rtd1295-rtc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek RTD129x real-time clock

maintainers:
  - Nguyen Quang Minh <oss@minhng99.eu>

allOf:
  - $ref: rtc.yaml#
  - if:
      required:
        - interrupts
    then:
      required:
        - realtek,iso-syscon

properties:
  compatible:
    const: realtek,rtd1295-rtc

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  interrupts:
    maxItems: 1

  realtek,iso-syscon:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Isolation controller containing alarm enable and status registers.

  wakeup-source: true

required:
  - compatible
  - reg
  - clocks

unevaluatedProperties: false

examples:
  - |
    rtc@9801b600 {
        compatible = "realtek,rtd1295-rtc";
        reg = <0x9801b600 0x34>;
        clocks = <&rtc_clk>;
        interrupt-parent = <&iso_irq_mux>;
        interrupts = <13>;
        realtek,iso-syscon = <&iso>;
        wakeup-source;
    };
