%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/realtek,rtd1296-usb-bus.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek RTD1296 USB clock and reset interface

maintainers:
  - Nguyen Quang Minh <oss@minhng99.eu>

properties:
  compatible:
    const: realtek,rtd1296-usb-bus

  reg:
    maxItems: 1
    description: Shared USB2 wrapper registers.

  clocks:
    maxItems: 1

  resets:
    minItems: 10
    maxItems: 10

  reset-names:
    items:
      - const: serdes
      - const: usb2-0
      - const: usb2-1
      - const: usb2-2
      - const: usb3-0
      - const: usb2-3
      - const: usb3-1
      - const: controller
      - const: mdio0
      - const: mdio1

  usb2-vbus-supply:
    description: VBUS supply for the port shared by EHCI and OHCI.

  '#address-cells':
    const: 1

  '#size-cells':
    const: 1

  ranges: true

patternProperties:
  "^(usb|phy|type-c)@[0-9a-f]+$":
    type: object
    additionalProperties: true

required:
  - compatible
  - reg
  - clocks
  - resets
  - reset-names
  - '#address-cells'
  - '#size-cells'
  - ranges

additionalProperties: false
